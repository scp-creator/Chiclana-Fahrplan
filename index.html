<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<title>Chiclana Fahrplan</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="scroll-area">
  <header class="hero">
    <div class="hero-copy">
      <div class="hero-title">Chiclana</div>
      <div class="hero-subtitle" data-i18n="subtitle">Fahrplan</div>
    </div>
    <div class="hero-photo" aria-label="Castillo de Sancti Petri bei Sonnenuntergang"></div>
    <div class="hero-fade"></div>
  </header>

  <main>
    <section class="route-stack">
      <div class="route-field autocomplete">
        <label for="from" data-i18n="from">Von</label>
        <input id="from" autocomplete="off" placeholder="Haltestelle eingeben oder wählen" data-i18n-placeholder="stopPlaceholder">
        <div id="fromSuggestions" class="suggestions hidden"></div>
      </div>
      <button id="swapBtn" class="swap-btn" type="button" aria-label="Von und Nach tauschen">↕</button>
      <div class="route-field autocomplete">
        <label for="to" data-i18n="to">Nach</label>
        <input id="to" autocomplete="off" placeholder="Haltestelle eingeben oder wählen" data-i18n-placeholder="stopPlaceholder">
        <div id="toSuggestions" class="suggestions hidden"></div>
      </div>
    </section>

    <section class="controls">
      <label class="field"><span data-i18n="date">Datum</span><input id="date" type="date"></label>
      <label class="field"><span data-i18n="time">Uhrzeit</span><input id="time" type="time" aria-label="Uhrzeit"></label>
    </section>

    <div class="tabs">
      <button data-type="bus" class="active bus">🚌 <span data-i18n="bus">Bus</span></button>
      <button data-type="tram" class="tram">🚋 <span data-i18n="tram">Tram</span></button>
      <button data-type="all" class="all"><span data-i18n="both">Beide</span></button>
    </div>

    <button id="searchBtn" class="search-btn" type="button"><span data-i18n="search">Verbindungen suchen</span></button>

    <div class="quick-time"><span data-i18n="selectedTime">Fahrten ab</span> <b id="quickTime">--:--</b> · <span id="quickDate">--.--.----</span></div>

    <div class="section-head"><b data-i18n="available">Verfügbare Verbindungen</b><span id="count"></span></div>
    <div id="results"></div>
  </main>
  </div>

  <nav>
    <a class="selected" data-nav="search">⌕<small data-i18n="navSearch">Suchen</small></a>
    <a data-nav="favorites">♡<small data-i18n="navFavorites">Favoriten</small></a>
    <a data-nav="lines">♧<small data-i18n="navLines">Linien</small></a>
    <a data-nav="more">•••<small data-i18n="navMore">Mehr</small></a>
  </nav>
</div>

<div id="detail" class="modal hidden">
  <div class="sheet">
    <button id="closeDetail" class="close" type="button" aria-label="Schließen">‹</button>
    <div id="detailBody"></div>
  </div>
</div>

<div id="moreModal" class="modal hidden">
  <div class="sheet more-sheet">
    <button id="closeMore" class="close" type="button" aria-label="Schließen">×</button>
    <h2 data-i18n="moreTitle">Mehr</h2>
    <button class="more-row" id="languageRow"><span>🌐</span><span data-i18n="language">Sprache</span><b>›</b></button>
    <div id="languagePanel" class="language-box hidden">
      <div class="language-switch" role="group" aria-label="Sprache">
        <button type="button" data-lang="de" class="lang">🇩🇪 Deutsch</button>
        <button type="button" data-lang="es" class="lang">🇪🇸 Español</button>
        <button type="button" data-lang="en" class="lang">🇬🇧 English</button>
      </div>
    </div>
    <button class="more-row" id="aboutRow"><span>ⓘ</span><span data-i18n="about">Über diese App</span><b>›</b></button>
    <div id="aboutPanel" class="about-panel hidden">
      <h3>Chiclana Fahrplan</h3>
      <p><b data-i18n="imageCreditTitle">Bildnachweis</b></p>
      <p data-i18n="imageCreditText">Headerbild: Castillo de Sancti Petri bei Sonnenuntergang. Quelle und Lizenz bitte gemäß Originalquelle des verwendeten Fotos beachten.</p>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
